<!DOCTYPE html>
<html>
  <head>
    <title>LoLa Kim - Portfolio</title>
  </head>

  <body>
    <div class="top-banner">
      <div class="top-banner-content">
        <h1>LoLa Kim - Portfolio</h1>

        <div class="date-time">
          <h1 id="current-day"></h1>
          <h1 id="current-time"></h1>
        </div>
      </div>
    </div>

    <nav class="desktop-icons">
      <div class="about-me">
        <div class="button-container">
          <button id="about-me-btn" class="btn">
            <img src="images/about_me.png">
          </button>
          <label for="about-me-btn">About Me</label>
        </div>
      </div>

      <div class="contact-links">
        <div class="button-container">
          <button id="contact-btn" class="btn">
            <img src="images/contact_links.png">
          </button>
          <label for="contact-btn">Contact Links</label>
        </div>
      </div>

      <div class="projects">
        <div class="button-container">
          <button id="projects-btn" class="btn">
            <img src="images/projects_blue.png">
          </button>
          <label for="projects-btn">Projects</label>
        </div>
      </div>

      <div class="skills">
        <div class="button-container">
          <button id="skills-btn" class="btn">
            <img src="images/skills.png">
          </button>
          <label for="skills-btn">Skills</label>
        </div>
      </div>

      <div class="github">
        <div class="button-container">
          <button id="github-btn" class="btn">
            <img src="images/github.png">
          </button>
          <label for="github-btn">GitHub</label>
        </div>
      </div>

      <div class="linkedin">
        <div class="button-container">
          <button id="linkedin-btn" class="btn">
            <img src="images/linkedin.png">
          </button>
          <label for="linkedin-btn">LinkedIn</label>
        </div>
      </div>
  
        <!-- <div id="about-me-popup">
          <div class="popup-banner">
            <div class="popup-banner-content">
              <div class="popup-banner-text">
                <h1>About Me</h1>
              </div>
            </div>
          </div>
        </div> -->

    </nav>

    <div class="bottom-banner">
      <div class="bottom-banner-content">
        <h1>Start</h1>
      </div>
    </div>

  </body>

  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
